services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mwahli
      POSTGRES_PASSWORD: mwahli
      POSTGRES_DB: mwahli
    ports:
      - "5432:5432"
    volumes:
      - mwahli_pg:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mwahli -d mwahli"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - mwahli_redis:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - mwahli_minio:/data

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - mwahli_search:/usr/share/opensearch/data

volumes:
  mwahli_pg:
  mwahli_redis:
  mwahli_minio:
  mwahli_search:
